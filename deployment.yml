apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-test
spec:
  replicas: 2
  selector:
    matchLabels:
      app: k8s-test
  template:
    metadata:
      labels:
        app: k8s-test
    spec:
      containers:
      - name: k8s-test
        image: bstashchuk/k8s-web-hello
        resources:
          requests:
            memory: "64Mi"
            cpu: "250m"  # четверть 1 cpu
          limits:
            memory: "128Mi"
            cpu: "500m"
        ports:
        - containerPort: 3000

          
